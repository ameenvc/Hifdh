name: Build mobile previews
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (iOS output is simulator-only, not an installable iPhone app)
        type: choice
        options: [android, ios, both]
        default: android
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hifdh-Android-preview
          path: artifacts/Hifdh-preview.apk*
          retention-days: 30
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - name: Compile unsigned simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent artifacts/ios/Build/Products/Debug-iphonesimulator/App.app artifacts/Hifdh-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hifdh-iOS-simulator-not-for-iPhone
          path: artifacts/Hifdh-ios-simulator.zip
          retention-days: 30
